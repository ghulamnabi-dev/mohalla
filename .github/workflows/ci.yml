name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (.NET 9)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore "Society Management System/Society Management System.sln"

      - name: Build (Release)
        run: dotnet build "Society Management System/Society Management System.sln" --no-restore -c Release

      - name: Integration tests (SQLite in-memory)
        run: dotnet test "Society Management System.Tests/Society Management System.Tests.csproj" --no-build -c Release --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Server/Society Management System.Tests/TestResults
          retention-days: 7

      - name: Publish API
        run: dotnet publish "Society Management System/Society Management System.csproj" --no-build -c Release -o ../publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish
          retention-days: 7
