name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build (Angular 19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/sms/browser
          retention-days: 7
