<mat-sidenav-container class="shell">
  <mat-sidenav #drawer class="sidenav" [mode]="mode()" [opened]="!isHandset()" [fixedInViewport]="isHandset()">
    <a class="brand" routerLink="dashboard">
      <span class="logo"><mat-icon>apartment</mat-icon></span>
      <span class="brand-text">
        <strong>Society</strong>
        <small>Management System</small>
      </span>
    </a>

    <mat-nav-list class="nav">
      @for (item of nav; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active" (click)="isHandset() && drawer.close()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <a href="https://github.com/gn-4200/SocietyManagmentSystem" target="_blank" rel="noopener" class="muted">
        <mat-icon>code</mat-icon> API on GitHub
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle navigation"><mat-icon>menu</mat-icon></button>
      }
      <span class="spacer"></span>
      <button mat-icon-button (click)="theme.toggle()" [matTooltip]="theme.dark() ? 'Light mode' : 'Dark mode'" aria-label="Toggle theme">
        <mat-icon>{{ theme.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <span class="avatar">{{ initials() }}</span>
        <span class="user-name">{{ userName() }}</span>
        <mat-icon>expand_more</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item disabled><mat-icon>person</mat-icon>{{ userName() }}</button>
        <mat-divider />
        <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon>Sign out</button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
