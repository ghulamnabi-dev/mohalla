# One-command local stack: SQL Server + API.
#   docker compose up --build
# Then open http://localhost:5091 for Swagger.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_strong_Passw0rd}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build:
      context: ./Server/Society Management System
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=SMS;User Id=sa;Password=${SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True"
      JWT__Secret: ${JWT_SECRET:-change-me-to-a-random-string-of-at-least-32-characters}
      JWT__Issuer: SocietyManagementStudio
      JWT__Audience: SMSClients
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "5091:8080"

volumes:
  mssql-data:
